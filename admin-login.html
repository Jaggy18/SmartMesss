<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartMess - Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🍽️ SmartMess</h1>
    <p>Admin Login</p>
</header>


<section class="login-container">

    <div class="login-box">

        <h2>🔐 Admin Login</h2>

        <p>Login to manage SmartMess</p>


        <form id="loginForm">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="loginMessage"></p>


        <a href="index.html">
            ← Back to SmartMess
        </a>

    </div>

</section>


<footer>
    <p>© 2026 SmartMess | Admin Panel</p>
</footer>


<script src="admin-login.js"></script>

</body>

</html>
